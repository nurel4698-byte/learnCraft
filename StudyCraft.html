<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}</style></head><body><title>StudyCraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed voxel world, HUD floats over it, lessons open as cards over a dimmed world.
   Palette comes from the StudyCraft deck: forest green ink, lime accent. Single dark look by choice. */
:root{
  --ink:#0b2217; --ink2:#0f2d1d; --panel:#12301f; --panel2:#1b4229; --line:#2f7048;
  --text:#eaf8e5; --muted:#9fcaa6; --lime:#b6f07a; --lime-d:#5f9a2e; --gold:#ffc94a;
  --bad:#ff8068; --good:#6ff08a; --water:#52b6f5; --hp:#ff5d5d; --food:#ffb14a;
  --font-body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-pixel:"Press Start 2P","Courier New",monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
#app{position:relative;height:100%;overflow:hidden;background:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
.hud{position:absolute;inset:0;pointer-events:none}
.hud>*{position:absolute}
.btn{appearance:none;border:2px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 14px;border-radius:4px;cursor:pointer;font-weight:500;box-shadow:0 3px 0 #08170f;pointer-events:auto;min-height:40px}
.btn:hover{border-color:var(--lime)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #08170f}
.btn.pri{background:var(--lime);border-color:var(--lime);color:#10300f;font-weight:700;box-shadow:0 3px 0 var(--lime-d)}
.btn.pri:active{box-shadow:0 1px 0 var(--lime-d)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:default}

/* HUD */
.stats{top:12px;left:max(16px,env(safe-area-inset-left,0px));display:grid;gap:6px;width:min(220px,46vw)}
.bar{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.bar i{display:block;height:12px;background:#08170f;border:2px solid #08170f;outline:2px solid var(--line);position:relative;overflow:hidden}
.bar i b{position:absolute;inset:0 auto 0 0;width:50%;transition:width .2s}
#hpb{background:var(--hp)} #fob{background:var(--food)}
.clock{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;background:rgba(8,23,15,.72);border:2px solid var(--line);padding:4px 10px;width:max-content;border-radius:4px}
.clock .sun{width:14px;height:14px;background:var(--gold);box-shadow:0 0 0 2px #fff3b8 inset}
.clock.night .sun{background:#cfe3ff;box-shadow:inset -5px -2px 0 #6b86b8;border-radius:50%}
.quests{top:calc(12px + 112px);left:max(16px,env(safe-area-inset-left,0px));width:min(300px,64vw);background:rgba(8,23,15,.78);border:2px solid var(--line);border-radius:4px;padding:8px 10px;display:grid;gap:7px;pointer-events:auto}
.q{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:12.5px;line-height:1.3}
.q .mk{width:16px;height:16px;border:2px solid var(--lime);margin-top:1px;display:grid;place-items:center;font-size:11px;color:#10300f}
.q.done .mk{background:var(--lime)}
.q.done{color:var(--muted)}
.q b{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--lime)}
.q.done b{color:var(--muted)}
.tools{top:12px;right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px}
.tools .btn{padding:6px 12px;min-height:36px;min-width:40px}
.inv{bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:6px;max-width:calc(100% - 32px);flex-wrap:wrap;justify-content:center}
.slot{display:flex;align-items:center;gap:6px;background:rgba(8,23,15,.8);border:2px solid var(--line);padding:3px 8px 3px 4px;font-weight:700;font-size:13px;min-width:54px;border-radius:4px;pointer-events:auto;cursor:default}
.slot svg{width:22px;height:22px;image-rendering:pixelated}
.slot.zero{opacity:.45}
.slot.use{cursor:pointer;border-color:var(--lime)}
.prompt{bottom:calc(70px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);text-align:center}
.prompt .btn{display:inline-flex;gap:10px;align-items:center;padding:8px 14px;background:rgba(8,23,15,.9)}
.key{font-family:var(--font-pixel);font-size:10px;background:var(--lime);color:#10300f;padding:5px 7px;border-radius:2px}
.toast{top:64px;left:50%;transform:translateX(-50%);background:var(--panel2);border:2px solid var(--lime);padding:8px 14px;border-radius:4px;font-weight:500;max-width:calc(100% - 32px);text-align:center;box-shadow:0 4px 0 #08170f;opacity:0;transition:opacity .25s;pointer-events:none;z-index:3}
.toast.on{opacity:1}
.touch{display:none}
#app.has-touch .touch{display:block}
#joy{left:max(18px,env(safe-area-inset-left,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:124px;height:124px;border-radius:50%;background:rgba(8,23,15,.45);border:2px solid var(--line);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:38px;top:38px;width:48px;height:48px;border-radius:50%;background:rgba(182,240,122,.75);border:2px solid var(--lime)}
#act{right:max(18px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:92px;height:92px;border-radius:50%;background:var(--lime);color:#10300f;border:3px solid #fff;font-weight:800;pointer-events:auto;font-size:13px;line-height:1.1;padding:6px;text-align:center;box-shadow:0 4px 0 var(--lime-d)}
#act[hidden]{display:none}
#eatb{right:max(22px,env(safe-area-inset-right,0px));bottom:calc(184px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--food);color:#3a1d00;border:3px solid #fff;font-weight:800;pointer-events:auto}
#fade{position:absolute;inset:0;background:#02060a;opacity:0;pointer-events:none;transition:opacity .7s;z-index:5}

/* Title */
#title{position:absolute;inset:0;z-index:6;display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,rgba(6,22,14,.55),rgba(6,22,14,.88));touch-action:auto;overflow:auto}
.tcard{width:min(560px,100%);display:grid;gap:18px;justify-items:start}
.chipm{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--lime);color:#10300f;padding:4px 10px;border-radius:3px}
.logo{font-family:var(--font-pixel);font-size:clamp(28px,8vw,52px);line-height:1.15;color:var(--lime);margin:0;text-shadow:4px 4px 0 #0a3a1c,8px 8px 0 rgba(0,0,0,.35)}
.tag{margin:0;font-size:clamp(18px,4.4vw,26px);font-weight:800;line-height:1.25}
.tag span{color:var(--lime);display:block}
.sub{margin:0;color:var(--muted);max-width:46ch}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.keys{font-size:12.5px;color:var(--muted);margin:0}
.lang{display:flex;gap:0}
.lang .btn{border-radius:0;box-shadow:none;min-height:36px;padding:6px 12px}
.lang .btn:first-child{border-radius:4px 0 0 4px}.lang .btn:last-child{border-radius:0 4px 4px 0;border-left:0}
.lang .btn.on{background:var(--lime);color:#10300f;border-color:var(--lime);font-weight:700}

/* Modal cards */
#modal{position:absolute;inset:0;z-index:4;background:rgba(4,12,8,.74);display:grid;place-items:center;padding:14px max(14px,env(safe-area-inset-left,0px));touch-action:auto;overflow:auto}
#modal[hidden]{display:none}
.card{width:min(580px,100%);max-height:100%;overflow:auto;background:var(--panel);border:2px solid var(--line);border-radius:6px;box-shadow:0 6px 0 #08170f;padding:16px 18px 18px;display:grid;gap:12px;-webkit-user-select:text;user-select:text}
.who{display:flex;gap:12px;align-items:center}
.who canvas{width:48px;height:48px;image-rendering:pixelated;border:2px solid var(--line);background:var(--ink2)}
.who b{display:block;font-size:16px}
.role{font-size:12px;color:var(--muted)}
.say{margin:0;font-size:16px;line-height:1.5}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ph h2{margin:0;font-size:19px;line-height:1.2}
.subj{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--panel2);border:1px solid var(--line);padding:3px 8px;border-radius:3px;color:var(--lime);white-space:nowrap}
.goal{margin:0}
.hint{margin:0;font-size:13.5px;color:var(--gold);background:rgba(255,201,74,.08);border-left:3px solid var(--gold);padding:7px 10px}
.fb{min-height:22px;font-weight:500;margin:0}
.fb.ok{color:var(--good)} .fb.bad{color:var(--bad)}
.fields{display:grid;gap:10px}
.field{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center}
.field label{font-size:14.5px}
.field input{background:var(--ink);border:2px solid var(--line);color:var(--text);padding:8px 10px;border-radius:4px;font-size:17px;font-weight:700;width:100%;text-align:center;font-variant-numeric:tabular-nums}
.field input.good{border-color:var(--good)} .field input.bad{border-color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:2px solid var(--line);background:var(--ink2);padding:9px 12px;border-radius:4px;cursor:pointer;font-weight:500}
.chip.on{background:var(--lime);border-color:var(--lime);color:#10300f;font-weight:700}
.chip.lock{background:var(--lime-d);color:#fff;border-color:var(--lime-d)}
.chip.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.grid{--cell:clamp(20px,calc((100vw - 96px)/10),31px);display:grid;grid-template-columns:repeat(10,var(--cell));grid-auto-rows:var(--cell);gap:2px;background:var(--ink);padding:6px;border:2px solid var(--line);width:max-content;max-width:100%;touch-action:none;position:relative;margin:0 auto}
.grid div{background:#1a4a2b}
.grid div.s{background:var(--lime)}
.gl{text-align:center;font-family:var(--font-pixel);font-size:14px;color:var(--lime);min-height:20px;margin:0}
.seq{display:flex;gap:8px;flex-wrap:wrap}
.seq .chip{display:grid;gap:4px;justify-items:center;width:92px;padding:8px 4px;font-size:12.5px;text-align:center}
.seq svg{width:48px;height:48px}
.slots{display:flex;gap:6px}
.slots span{width:30px;height:30px;border:2px dashed var(--line);display:grid;place-items:center;font-weight:700;color:var(--muted)}
.slots span.f{border:2px solid var(--lime);background:var(--lime);color:#10300f}
.lever{width:100%;height:auto;background:var(--ink2);border:2px solid var(--line)}
.beam{transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.sl{display:grid;gap:6px}
.sl input[type=range]{width:100%;accent-color:#b6f07a;height:28px}
.formula{font-family:var(--font-pixel);font-size:12px;line-height:2;background:var(--ink);border:2px solid var(--line);padding:10px 12px;text-align:center}
.formula em{font-style:normal;color:var(--gold)}
.legend{font-size:12.5px;color:var(--muted);margin:0;display:grid;gap:2px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw .chip{min-width:92px;display:grid;gap:2px;justify-items:center;font-variant-numeric:tabular-nums}
.sw .chip b{font-family:var(--font-pixel);font-size:16px;font-weight:400}
.lamp{display:block;margin:0 auto;width:84px;height:84px}
.skills{display:grid;gap:8px}
.sk{display:grid;grid-template-columns:110px 1fr 64px;gap:10px;align-items:center;font-size:13.5px}
.sk i{display:block;height:12px;background:var(--ink);border:2px solid var(--ink);outline:2px solid var(--line);position:relative}
.sk i b{position:absolute;inset:0 auto 0 0;background:var(--lime)}
.sk span{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin:0}
.big{font-family:var(--font-pixel);font-size:clamp(16px,4vw,22px);color:var(--lime);margin:0;line-height:1.4}
@media (max-width:520px){.field{grid-template-columns:1fr 92px}.sk{grid-template-columns:92px 1fr 52px}.quests{top:calc(12px + 100px)}}
@media (prefers-reduced-motion:reduce){.beam,.toast,#fade{transition:none}.chip.shake{animation:none}}
</style>

<div id="app">
  <canvas id="c"></canvas>
  <div class="hud" id="hud" hidden>
    <div class="stats">

    </div>
  </div>
</div>

function tone(f,d,type,vol,delay){
  try{

    const o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime+(delay||0);
    o.type=type||'square';o.frequency.value=f;g.gain.setValueAtTime(vol||.05,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+.02);
  }catch(e){}
}
function sfx(n){
  if(muted)return;
  if(n==='chop'){tone(150,.09,'square',.06);tone(100,.08,'square',.05,.05)}

  else if(n==='ok'){[523,659,784,1046].forEach((f,i)=>tone(f,.14,'square',.05,i*.09))}
  else if(n==='bad'){tone(190,.22,'sawtooth',.05);tone(140,.25,'sawtooth',.05,.1)}
  else if(n==='build'){[262,330,392,523,392,523,659].forEach((f,i)=>tone(f,.12,'square',.05,i*.08))}
  else if(n==='eat'){tone(380,.07,'triangle',.07);tone(480,.09,'triangle',.07,.08)}
  else if(n==='splash'){tone(300,.15,'sine',.06);tone(420,.12,'sine',.05,.07)}

function rnd(){rngSeed|=0;rngSeed=rngSeed+0x6D2B79F5|0;let a=Math.imul(rngSeed^rngSeed>>>15,1|rngSeed);a=a+Math.imul(a^a>>>7,61|a)^a;return((a^a>>>14)>>>0)/4294967296}
const pick=a=>a[Math.floor(Math.random()*a.length)];
const hash=(x,y)=>{const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s)};

/* ---------- world ---------- */
function inR(x,y,r,p){p=p||0;return x>=r.x-p&&x<r.x+r.w+p&&y>=r.y-p&&y<r.y+r.h+p}
const ZONES=[{x:26,y:19,w:9,h:7},{x:36,y:13,w:15,h:11},{x:22,y:27,w:14,h:12},{x:5,y:2,w:15,h:14}];
function genWorld(){
  rngSeed=20260;
  solid=new Uint8Array(MW*MH);water=new Uint8Array(MW*MH);ents=[];particles=[];pops=[];
  const I=(x,y)=>y*MW+x;
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    if(x<2||y<2||x>=MW-2||y>=MH-2)solid[I(x,y)]=1;
    const dx=(x-15)/7.6,dy=(y-34)/5.3;
    if(dx*dx+dy*dy<1+(hash(x,y)-.5)*.35&&x>1&&y<MH-2){water[I(x,y)]=1;solid[I(x,y)]=1}
    const ex=(x-52)/4,ey=(y-8)/3;
    if(ex*ex+ey*ey<1+(hash(y,x)-.5)*.3){water[I(x,y)]=1;solid[I(x,y)]=1}
  }
  // ruins walls (mechanism site)
  const wall=[];
  for(let x=7;x<=18;x++){wall.push([x,4]);if(x!==12&&x!==13)wall.push([x,8])}
  for(let y=5;y<=7;y++){wall.push([7,y]);wall.push([18,y])}
  wall.forEach(([x,y])=>{solid[I(x,y)]=1});
  ents.walls=wall;
  solid[I(BOULDER.tx,BOULDER.ty)]=1;solid[I(BOULDER.tx+1,BOULDER.ty)]=1;
  // campfire & npcs
  solid[I(CAMP.tx,CAMP.ty)]=1;
  for(const k in NPC){solid[I(NPC[k].tx,NPC[k].ty)]=1}
  const free=(x,y)=>x>2&&y>2&&x<MW-3&&y<MH-3&&!solid[I(x,y)]&&!water[I(x,y)]&&!ents.some(e=>e.tx===x&&e.ty===y)&&!ZONES.some(z=>inR(x,y,z,0))&&!(x>=PLOT.tx-1&&x<PLOT.tx+7&&y>=PLOT.ty-1&&y<PLOT.ty+6);
  const placeN=(k,n,box)=>{let c=0,tries=0;while(c<n&&tries++<4000){const x=Math.floor(box[0]+rnd()*(box[1]-box[0])),y=Math.floor(box[2]+rnd()*(box[3]-box[2]));if(!free(x,y))continue;if(k==='tree'&&ents.some(e=>e.k==='tree'&&Math.abs(e.tx-x)<1&&Math.abs(e.ty-y)<1))continue;const e={k,tx:x,ty:y,alive:true,t:0,has:true};ents.push(e);if(k!=='wheat')solid[I(x,y)]=1;c++}};
  placeN('tree',170,[2,MW-2,2,MH-2]);
  placeN('rock',34,[2,MW-2,2,MH-2]);
  placeN('bush',30,[2,MW-2,2,MH-2]);
  // wheat needs a looser zone (farm surroundings)
  const freeW=(x,y)=>!solid[I(x,y)]&&!water[I(x,y)]&&!ents.some(e=>e.tx===x&&e.ty===y)&&!(x>=PLOT.tx-1&&x<PLOT.tx+7&&y>=PLOT.ty-1&&y<PLOT.ty+6)&&!(x===NPC.zhanara.tx&&y===NPC.zhanara.ty);
  let wc=0,wt=0;while(wc<18&&wt++<3000){const x=22+Math.floor(rnd()*16),y=27+Math.floor(rnd()*11);if(!freeW(x,y))continue;ents.push({k:'wheat',tx:x,ty:y,alive:true,t:0});wc++}
  // a few extra trees & bushes near camp so the first minutes are easy
  const near=(k,n)=>{let c=0,tries=0;while(c<n&&tries++<500){const x=CAMP.tx-10+Math.floor(rnd()*20),y=CAMP.ty-8+Math.floor(rnd()*16);if(Math.hypot(x-CAMP.tx,y-CAMP.ty)<5)continue;if(!free(x,y)&&!(ZONES.slice(1).every(z=>!inR(x,y,z,0))&&!solid[I(x,y)]&&!water[I(x,y)]&&!ents.some(e=>e.tx===x&&e.ty===y)))continue;ents.push({k,tx:x,ty:y,alive:true,t:0,has:true});solid[I(x,y)]=1;c++}};
  near('tree',8);near('bush',5);near('rock',4);
  buildGround();
}

/* ---------- render ---------- */

/* ---------- gameplay ---------- */
const keys={};let joy={x:0,y:0},modalOpen=false;
function warm(){

  if(S.m1.built&&Math.hypot(P.x-HOUSE.cx,P.y-(HOUSE.bottom-30))<160)return true;
  return false;
}
function blocked(x,y){

    const tx=Math.floor((x+dx)/T),ty=Math.floor((y+dy)/T);
    if(tx<0||ty<0||tx>=MW||ty>=MH||solid[ty*MW+tx])return true;
  }
  if(S.m1.built){const L=S.m1.L*T,x0=HOUSE.cx-L/2;if(x+6>x0&&x-6<x0+L&&y+3>HOUSE.bottom-2*T&&y-5<HOUSE.bottom)return true}
  return false;
}
function spawnFx(x,y,col,n,spd){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*(spd||120),vy:-Math.random()*(spd||120)-20,life:.5+Math.random()*.4,s:2+Math.floor(Math.random()*3),c:Array.isArray(col)?pick(col):col})}
function pop(txt,x,y,c){pops.push({txt,x,y,c:c||'#b6f07a',life:1.1})}
let toastT=0;
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2600)}

function sim(dt){
  const prevN=dark()>.5;
  S.tod+=dt;if(S.tod>=CYCLE){S.tod-=CYCLE;S.day++;toast(t('t_newday',{n:S.day}))}
  const nn=dark()>.5;if(nn&&!prevN)toast(t('t_night'));
  S.food=Math.max(0,S.food-.42*dt);S.fuel=Math.max(0,S.fuel-.38*dt);
  const cold=dark()>.4&&!warm();

let target=null;
function nearWaterTile(){
  const tx=Math.floor(P.x/T),ty=Math.floor(P.y/T);let best=1e9;
  for(let y=ty-2;y<=ty+2;y++)for(let x=tx-2;x<=tx+2;x++){if(x<0||y<0||x>=MW||y>=MH||!water[y*MW+x])continue;const d=Math.hypot(P.x-(x*T+16),P.y-(y*T+16));if(d<best)best=d}
  return best;
}
function findTarget(){
  let best=null,bd=1e9;
  const tryT=(o,d,max)=>{if(d<max&&d<bd){bd=d;best=o}};
  for(const e of ents){
    if(e.k==='tree'&&e.alive)tryT({k:'tree',e},Math.hypot(P.x-(e.tx*T+16),P.y-(e.ty*T+16)),44);
    else if(e.k==='rock'&&e.alive)tryT({k:'rock',e},Math.hypot(P.x-(e.tx*T+16),P.y-(e.ty*T+16)),44);
    else if(e.k==='bush'&&e.has)tryT({k:'bush',e},Math.hypot(P.x-(e.tx*T+16),P.y-(e.ty*T+16)),44);
    else if(e.k==='wheat'&&e.alive)tryT({k:'wheat',e},Math.hypot(P.x-(e.tx*T+16),P.y-(e.ty*T+16)),38);
  }
  for(const id in NPC){const n=NPC[id];tryT({k:'npc',id},Math.hypot(P.x-(n.tx*T+16),P.y-(n.ty*T+16))-8,60)}
  tryT({k:'fire'},Math.hypot(P.x-(CAMP.tx*T+16),P.y-(CAMP.ty*T+16)),52);
  const wd=nearWaterTile();if(wd<46)tryT({k:'water'},wd+6,52);
  // plot
  const fv=S.fv,px0=PLOT.tx*T,py0=PLOT.ty*T,px1=px0+fv.cols*T,py1=py0+fv.rows*T;
  const dxp=Math.max(px0-P.x,0,P.x-px1),dyp=Math.max(py0-P.y,0,P.y-py1);
  if(S.m2.step>=3)tryT({k:'plot'},Math.hypot(dxp,dyp)+20,56);
  if(S.m3.step>=3&&!S.flags.chest)tryT({k:'chest'},Math.hypot(P.x-12.5*T,P.y-(5.5*T+8)),52);
  if(S.m1.built)tryT({k:'house'},Math.hypot(P.x-HOUSE.cx,P.y-(HOUSE.bottom+6)),58);
  return best;
}

function talk(id){
  const S1=S.m1,S2=S.m2,S3=S.m3,hv=S.hv,fv=S.fv;
  if(id==='aya'){
    const lines=questLines();
    const list=h('div',{style:'display:grid;gap:6px;font-size:14px'},lines.map(l=>h('div',null,h('b',{style:'color:var(--lime)'},l.title+': '),l.text)));
    if(!S.flags.met){S.flags.met=1;say('aya',t('aya_intro'),[{l:t('ok'),p:1,fn:closeModal}])}
    else{const e=nextExtra('aya');say('aya',t('aya_help')+(e?' '+t('ex_offer'):''),e?[{l:t('ok'),fn:closeModal},{l:t('ex_go'),p:1,fn:()=>startExtra(e)}]:[{l:t('ok'),p:1,fn:closeModal}],list)}
    return;
  }
  if(id==='nurbol'){
    const L=Math.max(hv.w,hv.h);
    if(S1.step===0)say(id,t('nu_intro'),[{l:t('close'),fn:closeModal},{l:t('nu_start'),p:1,fn:()=>gridPuzzle(hv,()=>{S1.w=Math.min(hv.w,hv.h);S1.h=Math.max(hv.w,hv.h);S1.L=L;S1.step=1;houseRoof()})}]);
    else if(S1.step===1)houseRoof();
    else if(S1.step===2)houseMaterials();
    else offerExtra(id,'nu_done');
  }
  else if(id==='zhanara'){
    if(S2.step===0)say(id,t('zh_intro'),[{l:t('close'),fn:closeModal},{l:t('go'),p:1,fn:farmBio1}]);
    else if(S2.step===1)farmBio2();
    else if(S2.step===2)farmMath();
    else {const k={3:'zh_rem3',4:'zh_rem4',5:'zh_rem5',6:'zh_rem6',7:'zh_done'}[S2.step];const vv={a:S.inv.seeds,b:fv.rows*fv.cols};if(S2.step===7)offerExtra(id,k,vv);else say(id,t(k,vv),[{l:t('ok'),p:1,fn:closeModal}])}
  }
  else if(id==='kubanych'){
    if(S3.step===0)say(id,t('ku_intro'),[{l:t('close'),fn:closeModal},{l:t('ku_start'),p:1,fn:mechLever}]);
    else if(S3.step===1)mechLogic(1);
    else if(S3.step===2)mechLogic(2);
    else offerExtra(id,'ku_done');
  }
}

function tessFigure(){
  const W=340,H=250,cv=h('canvas',{width:W,height:H,style:'width:100%;max-width:340px;background:#0b1a14;border-radius:8px;display:block;margin:0 auto'});
  const g=cv.getContext('2d'),a=[0.5,0.2,0.3],auto={on:true};let ph=0,seen=false;
  const V=[],E=[];for(let i=0;i<16;i++)V.push([i&1?1:-1,i&2?1:-1,i&4?1:-1,i&8?1:-1]);
  for(let i=0;i<16;i++)for(let b=0;b<4;b++){const j=i^(1<<b);if(j>i)E.push([i,j])}
  const rot=(p,th,i,j)=>{const c=Math.cos(th),s=Math.sin(th),x=p[i],y=p[j];p[i]=x*c-y*s;p[j]=x*s+y*c};
  const draw=()=>{
    if(auto.on){a[0]+=.011;a[1]+=.007;a[2]+=.005}
    ph+=.004;
    const P=V.map(v=>{const p=v.slice();rot(p,a[0],0,3);rot(p,a[1],1,3);rot(p,a[2],2,3);rot(p,.45+ph,0,2);rot(p,.35,1,2);
      const k4=2.6/(3.4-p[3]),z=p[2]*k4,k3=3.2/(4.2-z);
      return{x:W/2+p[0]*k4*k3*62,y:H/2+p[1]*k4*k3*62,w:p[3]}});
    g.clearRect(0,0,W,H);g.lineWidth=1.6;
    E.forEach(([i,j])=>{const m=(P[i].w+P[j].w)/2;g.strokeStyle='hsl('+(150+m*45)+',70%,'+(55+m*12)+'%)';g.beginPath();g.moveTo(P[i].x,P[i].y);g.lineTo(P[j].x,P[j].y);g.stroke()});
    P.forEach(q=>{g.fillStyle='#ffd96a';g.beginPath();g.arc(q.x,q.y,2.6,0,6.283);g.fill()});
  };
  const loop=()=>{if(cv.isConnected)seen=true;else if(seen)return;draw();requestAnimationFrame(loop)};
  requestAnimationFrame(loop);
  const btn=h('button',{class:'btn',type:'button'},t('tess_auto'));btn.addEventListener('click',()=>{auto.on=true;sfx('click')});
  const sl=(i,name)=>{const r=h('input',{type:'range',min:'0',max:'6.283',step:'0.01',value:String(a[i]%6.283),style:'width:92px','aria-label':name});
    r.addEventListener('input',()=>{auto.on=false;a[i]=parseFloat(r.value)});
    return h('label',{style:'display:flex;gap:6px;align-items:center;font-size:12px'},name,r)};
  return h('div',{style:'display:grid;gap:8px'},cv,h('div',{style:'display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center'},btn,sl(0,'XW'),sl(1,'YW'),sl(2,'ZW')),h('p',{class:'note'},t('tess_cap')));
}

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(S.started&&!modalOpen)sim(dt);
  else if(S.started){for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=380*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);if(S.m3.anim>=0&&S.m3.anim<1)S.m3.anim=Math.min(1,S.m3.anim+dt/1.2)}
  if(S.started){svT+=dt;if(svT>5){svT=0;saveGame()}target=modalOpen?null:findTarget();hudT+=dt;if(hudT>.12||hudDirty){hudT=0;updateHUD()}updatePrompt()}
  render();requestAnimationFrame(frame);
}
function boot(){
  FPV=lsGet('lc_view')==='fp';viewBtn();hasSave=loadGame();if(!hasSave)S=newState();applyLang();applyMute();genWorld();if(S.m3.step>=3){solid[BOULDER.ty*MW+BOULDER.tx]=0;solid[BOULDER.ty*MW+BOULDER.tx+1]=0}resize();
  requestAnimationFrame(t0=>{last=t0;frame(t0)});
}
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(()=>{});}
window.addEventListener('pagehide',saveGame);
boot();
if(/[?&]debug\b/.test(location.search))window.__lc={get S(){return S},P,ents:()=>ents,act,talk,solid:()=>solid,T,MW,MH,tp:(x,y)=>{P.x=x;P.y=y},houseRoof,mechLogic,mechLever,farmBio1,farmMath,gridPuzzle:()=>gridPuzzle(S.hv,()=>{}),showWin,render,setView,cv,target:v=>{target=v}};
</script>
